services:
  postgres:
    image: "postgres:16-alpine"
    environment: 
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD : shortener
      POSTGRES_DB : shortener
    ports: 
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  

  redis :
    image : "redis:7-alpine"
    ports: 
      - "6379:6379"


volumes : 
  pgdata :
